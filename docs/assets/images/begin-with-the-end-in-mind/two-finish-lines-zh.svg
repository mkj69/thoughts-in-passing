<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">人的思考，可以先告一段落</title><desc id="desc">Human thinking reaches a justified handoff before agent implementation finishes. New evidence may require a local reconsideration.</desc>
<defs><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#3f7350" stroke-width="1.4"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#9a503f" stroke-width="1.4"/></marker></defs>
<rect width="640" height="650" rx="12" fill="#f8f7f2"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="36" text-anchor="start" font-size="16" font-weight="400" fill="#3f7350"><tspan x="28" dy="0">03  /  两条不同的完成线</tspan></text><text x="28" y="76" text-anchor="start" font-size="26" font-weight="400" fill="#29332e"><tspan x="28" dy="0">人的思考，可以先告一段落</tspan></text><text x="36" y="127" text-anchor="start" font-size="17" font-weight="400" fill="#3f7350"><tspan x="36" dy="0">人的参与</tspan></text><rect x="36" y="145" width="308" height="95" rx="9" fill="#dfead9" stroke="#b2c4a9"/><text x="56" y="179" text-anchor="start" font-size="22" font-weight="500" fill="#3f7350"><tspan x="56" dy="0">集中构思与决策</tspan></text><text x="56" y="213" text-anchor="start" font-size="17" font-weight="400" fill="#3f7350"><tspan x="56" dy="0">看见整体，也理解关键取舍</tspan></text><path d="M346,191 L382,191" fill="none" stroke="#3f7350" stroke-width="2" marker-end="url(#green)"/><rect x="395" y="145" width="209" height="95" rx="9" fill="#f5f7ef" stroke="#bbcbb2"/><text x="415" y="179" text-anchor="start" font-size="22" font-weight="500" fill="#3f7350"><tspan x="415" dy="0">可以交接</tspan></text><text x="415" y="213" text-anchor="start" font-size="17" font-weight="400" fill="#3f7350"><tspan x="415" dy="0">注意力得到释放</tspan></text><path d="M190 241V285H320V309" fill="none" stroke="#3f7350" stroke-width="2" marker-end="url(#green)"/><text x="36" y="300" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="36" dy="0">Agent 的工作</tspan></text><rect x="36" y="321" width="568" height="104" rx="9" fill="#eceee7" stroke="#d4d9cd"/><text x="56" y="355" text-anchor="start" font-size="22" font-weight="500" fill="#29332e"><tspan x="56" dy="0">实现 → 运行 → 验证</tspan></text><text x="56" y="393" text-anchor="start" font-size="18" font-weight="400" fill="#727d73"><tspan x="56" dy="0">在约定资源内，把共同的完成状态变成作品</tspan></text><path d="M320,426 L320,454" fill="none" stroke="#3f7350" stroke-width="2" marker-end="url(#green)"/><rect x="180" y="468" width="280" height="76" rx="9" fill="#dfead9" stroke="#b2c4a9"/><text x="200" y="502" text-anchor="start" font-size="22" font-weight="500" fill="#3f7350"><tspan x="200" dy="0">作品完成</tspan></text><text x="36" y="591" text-anchor="start" font-size="20" font-weight="400" fill="#727d73"><tspan x="36" dy="0">新的事实可能需要人回来，</tspan><tspan x="36" dy="27.599999999999998">但无需重新理解整个项目。</tspan></text></g></svg>