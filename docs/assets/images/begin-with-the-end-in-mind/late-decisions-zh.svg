<svg xmlns="http://www.w3.org/2000/svg" width="640" height="622" viewBox="0 0 640 622" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">思考晚于执行，会发生什么？</title><desc id="desc">A loop from vague intent through execution and unfamiliar output to redesign and repeated execution.</desc>
<defs><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#3f7350" stroke-width="1.4"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#9a503f" stroke-width="1.4"/></marker></defs>
<rect width="640" height="622" rx="12" fill="#f8f7f2"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="36" text-anchor="start" font-size="16" font-weight="400" fill="#9a503f"><tspan x="28" dy="0">01  /  决策被推迟了</tspan></text><text x="28" y="76" text-anchor="start" font-size="26" font-weight="400" fill="#29332e"><tspan x="28" dy="0">思考晚于执行，会发生什么？</tspan></text><rect x="52" y="105" width="502" height="88" rx="9" fill="#eff1ea" stroke="#d8dfd1"/><text x="72" y="139" text-anchor="start" font-size="22" font-weight="500" fill="#29332e"><tspan x="72" dy="0">意图仍然模糊</tspan></text><text x="72" y="174" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="72" dy="0">目标和取舍尚未说清</tspan></text><path d="M303,194 L303,215" fill="none" stroke="#9a503f" stroke-width="2" marker-end="url(#red)"/><rect x="52" y="223" width="502" height="88" rx="9" fill="#eff1ea" stroke="#d8dfd1"/><text x="72" y="257" text-anchor="start" font-size="22" font-weight="500" fill="#29332e"><tspan x="72" dy="0">Agent 开始执行</tspan></text><text x="72" y="292" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="72" dy="0">未表达的决定被补进实现</tspan></text><path d="M303,312 L303,333" fill="none" stroke="#9a503f" stroke-width="2" marker-end="url(#red)"/><rect x="52" y="341" width="502" height="88" rx="9" fill="#eff1ea" stroke="#d8dfd1"/><text x="72" y="375" text-anchor="start" font-size="22" font-weight="500" fill="#29332e"><tspan x="72" dy="0">产物已经很复杂</tspan></text><text x="72" y="410" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="72" dy="0">人还没有形成完整认识</tspan></text><path d="M303,430 L303,451" fill="none" stroke="#9a503f" stroke-width="2" marker-end="url(#red)"/><rect x="52" y="459" width="502" height="88" rx="9" fill="#f4eae4" stroke="#dec8ba"/><text x="72" y="493" text-anchor="start" font-size="22" font-weight="500" fill="#29332e"><tspan x="72" dy="0">审核承担重新设计</tspan></text><text x="72" y="528" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="72" dy="0">理解、纠正，再等待</tspan></text><path d="M554 502H600V148H566" fill="none" stroke="#9a503f" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#red)"/><text x="52" y="591" text-anchor="start" font-size="20" font-weight="400" fill="#9a503f"><tspan x="52" dy="0">未完成的思考，以返工的形式回来了。</tspan></text></g></svg>