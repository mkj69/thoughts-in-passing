<svg xmlns="http://www.w3.org/2000/svg" width="640" height="731" viewBox="0 0 640 731" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">先让整件作品变清楚</title><desc id="desc">A rough whole enters a loop of consequential questions and visible alternatives, then becomes a shared outcome that guides execution and verification.</desc>
<defs><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#3f7350" stroke-width="1.4"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#9a503f" stroke-width="1.4"/></marker></defs>
<rect width="640" height="731" rx="12" fill="#f8f7f2"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="36" text-anchor="start" font-size="16" font-weight="400" fill="#3f7350"><tspan x="28" dy="0">02  /  共同的完成状态</tspan></text><text x="28" y="76" text-anchor="start" font-size="26" font-weight="400" fill="#29332e"><tspan x="28" dy="0">先让整件作品变清楚</tspan></text><rect x="52" y="107" width="536" height="83" rx="9" fill="#eef2e8" stroke="#d8dfd1"/><text x="72" y="141" text-anchor="start" font-size="22" font-weight="500" fill="#29332e"><tspan x="72" dy="0">整件作品的粗略草图</tspan></text><text x="72" y="171" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="72" dy="0">结构、行为、证据都有位置</tspan></text><path d="M320,191 L320,216" fill="none" stroke="#3f7350" stroke-width="2" marker-end="url(#green)"/><rect x="35" y="229" width="570" height="182" rx="10" fill="#e8f0e5" stroke="#bbcdb6"/><text x="58" y="260" text-anchor="start" font-size="17" font-weight="500" fill="#3f7350"><tspan x="58" dy="0">连续构思</tspan></text><rect x="57" y="277" width="243" height="101" rx="9" fill="#f7faf3" stroke="#c7d5bf"/><text x="77" y="311" text-anchor="start" font-size="22" font-weight="500" fill="#29332e"><tspan x="77" dy="0">提出关键问题</tspan></text><text x="77" y="350" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="77" dy="0">什么会改变结果？</tspan></text><rect x="340" y="277" width="243" height="101" rx="9" fill="#f7faf3" stroke="#c7d5bf"/><text x="360" y="311" text-anchor="start" font-size="22" font-weight="500" fill="#29332e"><tspan x="360" dy="0">展示不同结果</tspan></text><text x="360" y="350" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="360" dy="0">比较，然后修改草图</tspan></text><path d="M303,309 L335,309" fill="none" stroke="#3f7350" stroke-width="2" marker-end="url(#green)"/><path d="M335,347 L303,347" fill="none" stroke="#3f7350" stroke-width="2" marker-end="url(#green)"/><path d="M320,412 L320,439" fill="none" stroke="#3f7350" stroke-width="2" marker-end="url(#green)"/><rect x="52" y="451" width="536" height="86" rx="9" fill="#dfead9" stroke="#aec4a5"/><text x="72" y="485" text-anchor="start" font-size="22" font-weight="500" fill="#3f7350"><tspan x="72" dy="0">共享的完成状态</tspan></text><text x="72" y="518" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="72" dy="0">要交付什么，如何验收，未知怎样处理</tspan></text><path d="M320,538 L320,567" fill="none" stroke="#3f7350" stroke-width="2" marker-end="url(#green)"/><rect x="52" y="579" width="536" height="83" rx="9" fill="#eef2e8" stroke="#d8dfd1"/><text x="72" y="613" text-anchor="start" font-size="22" font-weight="500" fill="#29332e"><tspan x="72" dy="0">执行与验证</tspan></text><text x="72" y="643" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="72" dy="0">按约定实现，同一件作品逐步成为现实</tspan></text><text x="52" y="704" text-anchor="start" font-size="19" font-weight="400" fill="#3f7350"><tspan x="52" dy="0">新的事实，只重新打开受影响的决定。</tspan></text></g></svg>