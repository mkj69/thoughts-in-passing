<svg xmlns="http://www.w3.org/2000/svg" width="640" height="731" viewBox="0 0 640 731" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Make the whole work clear together</title><desc id="desc">A rough whole enters a loop of consequential questions and visible alternatives, then becomes a shared outcome that guides execution and verification.</desc>
<defs><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#3f7350" stroke-width="1.4"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#9a503f" stroke-width="1.4"/></marker></defs>
<rect width="640" height="731" rx="12" fill="#f8f7f2"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="36" text-anchor="start" font-size="16" font-weight="400" fill="#3f7350"><tspan x="28" dy="0">02  /  A SHARED OUTCOME</tspan></text><text x="28" y="76" text-anchor="start" font-size="26" font-weight="400" fill="#29332e"><tspan x="28" dy="0">Make the whole work clear together</tspan></text><rect x="52" y="107" width="536" height="83" rx="9" fill="#eef2e8" stroke="#d8dfd1"/><text x="72" y="141" text-anchor="start" font-size="22" font-weight="500" fill="#29332e"><tspan x="72" dy="0">A rough sketch of the whole</tspan></text><text x="72" y="171" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="72" dy="0">A place for structure, behavior and evidence</tspan></text><path d="M320,191 L320,216" fill="none" stroke="#3f7350" stroke-width="2" marker-end="url(#green)"/><rect x="35" y="229" width="570" height="182" rx="10" fill="#e8f0e5" stroke="#bbcdb6"/><text x="58" y="260" text-anchor="start" font-size="17" font-weight="500" fill="#3f7350"><tspan x="58" dy="0">ONE CONTINUOUS SESSION</tspan></text><rect x="57" y="277" width="243" height="101" rx="9" fill="#f7faf3" stroke="#c7d5bf"/><text x="77" y="311" text-anchor="start" font-size="22" font-weight="500" fill="#29332e"><tspan x="77" dy="0">Raise a real choice</tspan></text><text x="77" y="350" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="77" dy="0">What changes the work?</tspan></text><rect x="340" y="277" width="243" height="101" rx="9" fill="#f7faf3" stroke="#c7d5bf"/><text x="360" y="311" text-anchor="start" font-size="22" font-weight="500" fill="#29332e"><tspan x="360" dy="0">Show the effect</tspan></text><text x="360" y="350" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="360" dy="0">Compare, then revise</tspan></text><path d="M303,309 L335,309" fill="none" stroke="#3f7350" stroke-width="2" marker-end="url(#green)"/><path d="M335,347 L303,347" fill="none" stroke="#3f7350" stroke-width="2" marker-end="url(#green)"/><path d="M320,412 L320,439" fill="none" stroke="#3f7350" stroke-width="2" marker-end="url(#green)"/><rect x="52" y="451" width="536" height="86" rx="9" fill="#dfead9" stroke="#aec4a5"/><text x="72" y="485" text-anchor="start" font-size="22" font-weight="500" fill="#3f7350"><tspan x="72" dy="0">An understood outcome</tspan></text><text x="72" y="518" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="72" dy="0">What to deliver, how to check, what stays open</tspan></text><path d="M320,538 L320,567" fill="none" stroke="#3f7350" stroke-width="2" marker-end="url(#green)"/><rect x="52" y="579" width="536" height="83" rx="9" fill="#eef2e8" stroke="#d8dfd1"/><text x="72" y="613" text-anchor="start" font-size="22" font-weight="500" fill="#29332e"><tspan x="72" dy="0">Execution and verification</tspan></text><text x="72" y="643" text-anchor="start" font-size="17" font-weight="400" fill="#727d73"><tspan x="72" dy="0">Realize and check this same intended work</tspan></text><text x="52" y="704" text-anchor="start" font-size="19" font-weight="400" fill="#3f7350"><tspan x="52" dy="0">New evidence reopens only what it changes.</tspan></text></g></svg>